<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brain Garden — Play. Wonder. Connect.</title>
<style>
:root{
  --bg:#0d0f12; --panel:#14171b; --panel2:#191d22; --text:#f2f1ec; --muted:#9da3ad;
  --line:#2a3038; --accent:#b9e6c4; --accent2:#d7c7ff; --gold:#f0d58a; --danger:#e99a9a;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 70% 0%,#1a2220 0,#0d0f12 42%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;border-right:1px solid var(--line);padding:28px 18px;position:sticky;top:0;height:100vh;background:rgba(13,15,18,.8);backdrop-filter:blur(18px)}
.logo{padding:8px 10px 28px}.logo b{font-size:18px}.logo span{display:block;color:var(--muted);font-size:11px;letter-spacing:.15em;margin-top:6px}
.nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:12px;margin:3px 0}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}
.nav small{display:block;color:#69717d;margin:25px 12px 8px;font-size:10px;letter-spacing:.16em}
.main{max-width:1220px;width:100%;margin:auto;padding:34px 42px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:30px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(32px,4vw,52px);line-height:1.02;margin:8px 0 10px;letter-spacing:-.04em}
h2{font-size:28px;margin:0 0 8px;letter-spacing:-.025em}
h3{margin:0 0 6px}.sub{color:var(--muted);max-width:650px;line-height:1.55}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 15px;border-radius:12px}
.btn:hover{border-color:#505963}.btn.primary{background:var(--accent);color:#101411;border-color:var(--accent);font-weight:700}.btn.ghost{background:transparent}
.grid{display:grid;gap:16px}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(180deg,rgba(25,29,34,.94),rgba(17,20,24,.94));border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.card:hover{border-color:#3b434e}
.kicker{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.game{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.game .icon{font-size:32px;margin-bottom:14px}
.game .meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tag{font-size:11px;color:#b9c0ca;border:1px solid #303640;border-radius:99px;padding:5px 8px}
.section{margin-top:36px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px;gap:12px}
.stat{padding:17px 18px}.stat b{font-size:27px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.game-title{font-size:20px;font-weight:700}.desc{color:var(--muted);font-size:13px;line-height:1.45}
.progress{height:4px;background:#242a31;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent);width:0}
.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed #353c45;border-radius:20px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#20262c;border:1px solid #303740;border-radius:99px;padding:7px 10px;font-size:12px}
.node-list{display:flex;flex-wrap:wrap;gap:8px}.node-chip{border:1px solid #303740;background:#171b20;color:#dfe2e5;border-radius:99px;padding:8px 11px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(3,5,7,.72);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}
.modalbox{max-width:680px;width:100%;max-height:88vh;overflow:auto;background:#15191e;border:1px solid #3a414b;border-radius:24px;padding:28px;box-shadow:0 30px 100px #000}
.close{float:right;border:0;background:transparent;color:var(--muted);font-size:22px}.modalbox h2{font-size:36px}
.explain{font-size:16px;line-height:1.7;color:#d7d9dc}.highlight{border-left:2px solid var(--gold);padding:10px 14px;background:#1d1b15;border-radius:0 12px 12px 0;margin:18px 0}
textarea,input[type=text]{width:100%;background:#0f1215;border:1px solid #343b44;color:var(--text);border-radius:12px;padding:12px;outline:none}textarea:focus,input[type=text]:focus{border-color:#77818d}
label{font-size:12px;color:var(--muted);display:block;margin:14px 0 7px}
.bridgebox{padding:18px;border:1px solid #394149;border-radius:16px;background:#111519;margin:15px 0}.bridgepair{font-size:23px;font-weight:700;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lens{color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:12px}
.graph{height:560px;border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;background:
radial-gradient(circle at 18% 28%,rgba(185,230,196,.08),transparent 20%),
radial-gradient(circle at 72% 34%,rgba(215,199,255,.08),transparent 22%),
radial-gradient(circle at 48% 78%,rgba(240,213,138,.06),transparent 22%),
#0c0f12}
.graph:before{content:"";position:absolute;inset:0;opacity:.22;background-image:linear-gradient(#20262c 1px,transparent 1px),linear-gradient(90deg,#20262c 1px,transparent 1px);background-size:42px 42px}
.island{position:absolute;min-width:150px;padding:15px 17px;border-radius:45%;text-align:center;background:rgba(28,34,34,.88);border:1px solid #53645a;box-shadow:0 0 40px rgba(185,230,196,.07)}
.island small{display:block;color:#89928d;margin-top:4px}.i1{left:8%;top:18%}.i2{left:41%;top:10%;border-color:#5b536f}.i3{right:9%;top:25%}.i4{left:24%;bottom:13%;border-color:#716544}.i5{right:22%;bottom:10%;border-color:#4f5e71}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.line{stroke:#88b696;stroke-width:2;opacity:.72}.spark{stroke:#727982;stroke-dasharray:6 7;opacity:.42}.label{fill:#aab4ad;font-size:11px}
.recallq{font-size:25px;line-height:1.3;margin:18px 0}.answer{display:none;margin-top:15px;padding:15px;border-radius:14px;background:#20252b;color:#d7dbde;line-height:1.55}
.toast{position:fixed;right:20px;bottom:20px;background:#e7f4e9;color:#121713;padding:13px 16px;border-radius:13px;font-weight:700;display:none;z-index:30}
@media(max-width:850px){.sidebar{width:70px;padding:18px 8px}.logo b{font-size:0}.logo b:after{content:"🧠";font-size:24px}.logo span,.nav small{display:none}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{padding:25px 18px}.grid3,.trio{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.top{flex-direction:column}.graph{height:520px}}
</style>

<style>
.hero{position:relative;overflow:hidden;padding:clamp(26px,5vw,58px);border-radius:26px;background:radial-gradient(ellipse at 90% 0%,rgba(185,230,196,.15),transparent 48%),linear-gradient(135deg,#1c2522,#14181c 65%);border:1px solid #34443b}.hero h1{max-width:720px}.hero .sub{font-size:16px}.quiet{color:var(--muted);font-size:13px;line-height:1.6}.journey{max-width:800px;margin:auto}.journey h1{font-size:clamp(36px,5vw,58px);line-height:1.08}.journey .card{margin-top:18px}.chapter{color:#b9e6c4;letter-spacing:.14em;text-transform:uppercase;font-size:11px}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:15px 17px}.reveal{margin-top:20px;padding:22px;border-radius:16px;background:#202923;border:1px solid #415749;line-height:1.7}.door{background:linear-gradient(110deg,#24211b,#171a1b);border-color:#5c5140}.door h2{max-width:600px}.path{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.path span{border:1px solid #3a4a41;border-radius:99px;padding:7px 11px;color:#c3d8c9;font-size:12px}.garden-line{border-left:1px solid #729d7c;margin-left:12px;padding:0 0 18px 25px;position:relative}.garden-line:before{content:'✦';position:absolute;left:-8px;color:#b9e6c4;background:#121715}.garden-line h3{margin:0 0 7px}.game a,.card a{text-decoration:none;display:inline-block}.softbutton{background:none;border:0;color:#b9e6c4;padding:0;cursor:pointer;text-align:left}.softbutton:hover{text-decoration:underline}@media(prefers-reduced-motion:no-preference){.reveal{animation:arrive .35s ease}@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><b>Brain Garden</b></div>
  <nav class="nav">
    <button class="active" data-page="home">⌂ &nbsp; Home</button>
    <button data-page="play">🎮 &nbsp; Play</button>
    <button data-page="discover">✨ &nbsp; Discover</button>
    <button data-page="garden">🌱 &nbsp; Garden</button>
    <button data-page="recall">↻ &nbsp; Recall</button>
    <small>YOUR WORLD</small>
    <button data-page="profile">◌ &nbsp; Curiosity profile</button>
  </nav>
</aside>

<main class="main" id="app"></main>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

<script src="content.js"></script>
<script>
const games=[
{id:"krillion",name:"Krillion",icon:"🟣",type:"Lateral thinking",desc:"Associations, categories and unexpected valid answers.",url:"https://krillion.io/"},
{id:"grid",name:"Immaculate Grid",icon:"🏀",type:"Recall",desc:"Connect sports knowledge across two dimensions.",url:"https://www.immaculategrids.com/"},
{id:"connections",name:"Connections",icon:"🟨",type:"Pattern",desc:"Find the hidden relationship between four groups of words.",url:"https://www.nytimes.com/games/connections"},
{id:"fermi",name:"Fermi",icon:"📐",type:"Estimation",desc:"Estimate things you cannot directly calculate.",url:"https://fermi.gg/"},
{id:"nerdle",name:"Nerdle",icon:"🔢",type:"Math",desc:"Solve equations through constraint and deduction.",url:"https://nerdlegame.com/"},
{id:"nonogram",name:"Nonograms",icon:"🧩",type:"Logic",desc:"Reveal an image using numerical constraints.",url:"https://www.nonogramonline.org/"},
{id:"semantle",name:"Semantle",icon:"🕸️",type:"Language",desc:"Find a hidden word by semantic proximity.",url:"https://semantle.com/"},
{id:"globle",name:"Globle",icon:"🌍",type:"Geography",desc:"Use distance and spatial intuition to find a country.",url:"https://globle-game.com/game"},
{id:"worldle",name:"Worldle",icon:"🗺️",type:"Geography",desc:"Recognize countries from their silhouettes.",url:"https://worldle.com/"},
{id:"framed",name:"Framed",icon:"🎬",type:"Cinema",desc:"Identify a movie from stills.",url:"https://framed.wtf/"},
{id:"minesweeper",name:"Minesweeper",icon:"💣",type:"Logic",desc:"Probability, constraints and local deduction.",url:"https://minesweeper.online/"},
{id:"2048",name:"2048",icon:"🔲",type:"Strategy",desc:"Planning, spatial reasoning and compounding.",url:"https://2048.org/"},
{id:"chess",name:"Chess puzzles",icon:"♟️",type:"Strategy",desc:"Calculate tactics and recognize patterns.",url:"https://lichess.org/training"},
{id:"sudoku",name:"Sudoku",icon:"9️⃣",type:"Logic",desc:"Constraint satisfaction and clean deduction.",url:"https://sudoku.com/"},
{id:"flow",name:"Flow Free",icon:"🔵",type:"Spatial",desc:"Route every colour without crossing paths.",url:"https://www.flowfree.com/"}
];

const seedCards=[
{id:"bauhaus",title:"Bauhaus",domain:"Culture",hook:"What if art, engineering and everyday objects were designed as one discipline?",body:"Bauhaus was a German school that deliberately blurred the boundary between art, craft and industrial design. Its radical idea was not simply 'make things minimalist'; it was that design should be useful, reproducible and connected to ordinary life. That thinking helped shape modern architecture, furniture, typography and product design.",bridge:"Function can be beautiful when design is treated as a system.",related:["Product design","Architecture","Systems thinking"]},
{id:"nash",title:"Nash Equilibrium",domain:"Game Theory",hook:"What happens when your best move depends on what everyone else is doing?",body:"A Nash equilibrium is a situation where each player is choosing a strategy that makes sense given everyone else's strategy. No single player can improve their outcome by changing alone. The strange part is that an equilibrium can be stable even when everyone would prefer a different outcome.",bridge:"Strategic decisions are interdependent: your move changes the best move for everyone else.",related:["Incentives","Auctions","Competition"]},
{id:"kelly",title:"Kelly Criterion",domain:"Quant / Finance",hook:"Why can being right more often still make you lose?",body:"The Kelly idea is about sizing bets when you have an edge. If your advantage is small, betting too much can cause a disastrous drawdown; betting too little wastes the edge. The deeper lesson is that having a good decision rule is not enough — the size of the decision matters.",bridge:"Edge and exposure are different problems.",related:["Expected value","Risk","Portfolio sizing"]},
{id:"fermi",title:"Fermi Estimation",domain:"Mathematics",hook:"How can you estimate something you have no data for?",body:"A Fermi estimate breaks a huge unknown into a few reasonable factors. Instead of asking 'How many piano tuners are in Chicago?' directly, estimate population, households per tuner, and how often a piano needs tuning. The answer will be rough — but the reasoning is inspectable.",bridge:"A hard question can become easy when you decompose it into independent estimates.",related:["Back-of-the-envelope","Probability","Modeling"]},
{id:"malacca",title:"Strait of Malacca",domain:"World",hook:"Why does a narrow strip of water matter to the entire global economy?",body:"The Strait of Malacca is a major sea route between the Indian and Pacific Oceans. Ships moving between major Asian manufacturing and energy markets can use it as a key passage. Its geography turns a seemingly ordinary stretch of water into a strategic bottleneck.",bridge:"Geography can become economics when physical constraints shape movement.",related:["Trade","Singapore","Geopolitics"]},
{id:"searchfund",title:"Search Funds",domain:"Finance / Startups",hook:"What if you raised money before you even knew which company you wanted to buy?",body:"A search fund is a model in which an entrepreneur raises capital to search for a company to acquire, then operates it. Instead of starting a company from zero, the entrepreneur searches for an existing business and tries to grow it.",bridge:"Entrepreneurship can mean finding and operating an existing system, not only inventing a new one.",related:["Private equity","Acquisitions","Entrepreneurship"]}
];

seedCards.push({id:"networkeffects",title:"Network effects",domain:"Technology",hook:"Why does a product become more valuable as more people use it?",body:"A network effect happens when the value of a product to its users grows as more people join. A messaging app is more useful when your friends are there. More users can attract still more users, although crowding, spam and incompatible incentives can weaken the effect.",bridge:"A product can grow more useful because of the relationships it enables, not only its features.",related:["Platforms","Marketplaces","Incentives"]},
{id:"bankrun",title:"Bank runs",domain:"Finance",hook:"How can a healthy-looking bank get into trouble because everyone is worried?",body:"Banks typically hold only part of their deposits as immediately available cash. If many depositors try to withdraw at once, a bank may have to sell assets quickly or seek emergency funding. Even the expectation that others will withdraw can change an individual's decision.",bridge:"When decisions depend on what others might do, expectations can change outcomes.",related:["Liquidity","Trust","Game theory"]},
{id:"cyberrisk",title:"Cyber risk",domain:"Cybersecurity",hook:"Why can the weakest link be a person rather than a line of code?",body:"An attacker may try to bypass a secure system by persuading someone to hand over access. Phishing, for example, exploits trust and attention. Good security therefore combines technical controls with thoughtful workflows and clear ways to verify requests.",bridge:"A system is only as resilient as the interaction between its people, processes and technology.",related:["Trust","Risk","Systems"]});
seedCards.push({id:"mapprojection",title:"Why do maps lie?",domain:"Geometry",hook:"A sphere refuses to become a flat rectangle without distortion.",body:"Earth is roughly spherical, but a map is flat. Flattening a curved surface forces some property — area, distance, shape or direction — to stretch. Different map projections choose different trade-offs. The Mercator projection, for example, preserves local angles well but exaggerates areas near the poles.",bridge:"Changing representation changes which properties stay accurate.",related:["Geometry","Navigation","Cartography"]});
let state=JSON.parse(localStorage.getItem("brainGarden")||"null")||{
learned:seedCards.slice(0,3).map(x=>({...x,learnedAt:Date.now()})),
bridges:[{a:"nash",b:"kelly",label:"Incentives under uncertainty",strength:2}],
sparks:[],completed:{},history:[],profile:{plays:0}
};
function save(){localStorage.setItem("brainGarden",JSON.stringify(state))}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function page(name){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===name));render(name)}
function dailyGames(){
 let day=new Date().toISOString().slice(0,10), key="trio-"+day;
 let saved=JSON.parse(localStorage.getItem(key)||"null");
 if(saved) return saved;
 let pool=[...games], out=[];
 // light weighting: avoid games played yesterday when possible
 let shuffled=pool.sort(()=>Math.random()-.5);
 out=shuffled.slice(0,3).map(g=>g.id);localStorage.setItem(key,JSON.stringify(out));return out;
}
function gameBy(id){return games.find(g=>g.id===id)}
function gameCard(g){
 let done=!!state.completed[g.id];
 return `<div class="card game">
   <div><div class="icon">${g.icon}</div><div class="game-title">${g.name}</div><div class="desc">${g.desc}</div>
   <div class="meta"><span class="tag">${g.type}</span><span class="tag">10 min</span></div></div>
   <div class="actions"><button class="btn primary" onclick="openGame('${g.id}')">${done?"Play again":"Play"}</button><button class="btn ghost" onclick="learnPrompt('${g.type}')">＋ Learn</button></div>
 </div>`
}
function home(){
 return `<div class="top"><div><div class="eyebrow">Your curiosity gym</div><h1>What are you<br>curious about?</h1><p class="sub">Pick a door. Follow it as far as you like.</p></div></div>
 <div class="grid grid2"><div class="card"><div class="kicker">A little challenge</div><h2>Could a bank run start with a rumour?</h2><p class="sub">What would you do if you thought everyone else was about to withdraw their money?</p><div class="actions"><button class="btn primary" onclick="curiosityAnswer('withdraw')">I’d withdraw too</button><button class="btn" onclick="curiosityAnswer('wait')">I’d wait</button></div><div id="curiosityReveal" class="answer"></div></div>
 <div class="card"><div class="kicker">Play a favourite</div><h2>Krillion 🦐</h2><p class="sub">Find an answer that fits. How far can you dive?</p><button class="btn primary" onclick="openGame('krillion')">Play the original ↗</button></div></div>
 <div class="section grid grid2"><div class="card"><div class="kicker">Follow a question</div><h3>Why do products get better as more people use them?</h3><p class="desc">A tiny idea behind marketplaces, messaging and platforms.</p><button class="btn" onclick="openCard('networkeffects')">Take a look →</button></div><div class="card"><div class="kicker">Your space</div><h3>Visit your garden</h3><p class="desc">Return to the ideas and connections you’ve saved.</p><button class="btn" onclick="page('garden')">Open garden →</button></div></div>`;
}
function curiosityAnswer(choice){let el=document.getElementById('curiosityReveal');el.style.display='block';el.innerHTML=(choice==='withdraw'?'That might feel safest for you. But what if everyone has the same thought?':'Waiting might avoid adding to the panic—but what if others withdraw first?')+' <br><br>That tension can turn a rumour into a real liquidity problem. <button class="btn" onclick="openCard(\'bankrun\')">Explore the idea →</button>';}

function play(){
 return `<div class="top"><div><div class="eyebrow">Play</div><h1>Pick something fun.</h1><p class="sub">You can choose, or let the daily system choose for you. Every game can open a doorway into learning.</p></div><button class="btn primary" onclick="randomize()">🎲 Random 3</button></div>
 <div class="grid grid3">${games.map(gameCard).join("")}</div>`;
}
function discover(){
 let cards=seedCards.filter(c=>!["Culture","World","Geometry"].includes(c.domain));
 return `<div class="top"><div><div class="eyebrow">Discover</div><h1>Follow the interesting thing.</h1><p class="sub">Ideas from finance, technology, strategy and mathematics. Pick the question that catches you.</p></div></div>
 <div class="grid grid2">${cards.map(c=>`<div class="card"><div class="kicker">${c.domain}</div><h2>${c.title}</h2><p class="desc">${c.hook}</p><button class="btn primary" onclick="openCard('${c.id}')">Explore →</button></div>`).join("")}</div>
 <div class="section card"><div class="kicker">What’s happening now</div><h2>Follow today’s stories.</h2><p class="sub">Open the latest reporting, then bring a question back to your garden. These links open external news sites.</p><div class="actions"><a class="btn" href="https://www.reuters.com/business/finance/" target="_blank" rel="noopener noreferrer">Finance ↗</a><a class="btn" href="https://www.reuters.com/technology/" target="_blank" rel="noopener noreferrer">Technology ↗</a><a class="btn" href="https://www.reuters.com/world/india/" target="_blank" rel="noopener noreferrer">India ↗</a></div></div>`;
}
function garden(){
 let learned=state.learned;
 return `<div class="top"><div><div class="eyebrow">Garden</div><h1>Your intellectual landscape.</h1><p class="sub">Islands stay apart. Bridges make the empty space meaningful.</p></div><button class="btn primary" onclick="bridgeChallenge()">🌉 Find me a bridge</button></div>
 <div class="graph">
  <svg class="lines" viewBox="0 0 1000 560" preserveAspectRatio="none">
   <line x1="180" y1="150" x2="470" y2="95" class="line"/><text x="300" y="108" class="label">systems</text>
   <line x1="470" y1="95" x2="820" y2="170" class="line"/><text x="620" y="115" class="label">incentives</text>
   <line x1="180" y1="150" x2="380" y2="430" class="spark"/><text x="235" y="310" class="label">new territory</text>
   <line x1="380" y1="430" x2="730" y2="450" class="line"/><text x="515" y="435" class="label">decision-making</text>
  </svg>
  <div class="island i1">🧠 <b>Game Theory</b><small>${learned.filter(x=>x.domain.includes("Game")).length||1} concepts</small></div>
  <div class="island i2">💰 <b>Finance</b><small>${learned.filter(x=>x.domain.includes("Finance")||x.domain.includes("Quant")).length||1} concepts</small></div>
  <div class="island i3">🌍 <b>World</b><small>${learned.filter(x=>x.domain==="World").length||1} concepts</small></div>
  <div class="island i4">🎨 <b>Culture</b><small>${learned.filter(x=>x.domain==="Culture").length||1} concepts</small></div>
  <div class="island i5">📐 <b>Mathematics</b><small>${learned.filter(x=>x.domain.includes("Math")).length||1} concepts</small></div>
 </div>
 <div class="section grid grid2"><div class="card"><div class="kicker">Planted concepts</div><div class="node-list">${learned.map(x=>`<button class="node-chip" onclick="openCard('${x.id}')">${x.title}</button>`).join("")}</div></div>

// Concrete illustrations and useful next doors for Discover cards.
const discoverPaths={
kelly:{example:'Imagine a game where a fair coin pays you ₹2 for every ₹1 you bet on heads. The bet has a positive expected payoff, but betting everything still gives you a 50% chance of losing it all immediately. An advantage does not make an oversized bet safe.',next:'opportunity',door:'What is the hidden cost of choosing one option over another?'},
fermi:{example:'Suppose a campus has 4,000 students, half buy coffee on a given day, and each buys one cup. A rough estimate is 4,000 × ½ × 1 = 2,000 cups a day. These are assumed numbers, not measurements; changing them changes the answer.',next:'queues',door:'What happens when all those students arrive at once?'},
searchfund:{example:'Imagine an aspiring entrepreneur raises money to search for a small profitable company. After finding one, they arrange an acquisition and take on an operating role. The funding and deal structure vary; finding a suitable company is not guaranteed.',next:'principal',door:'What happens when the people funding a decision have different incentives?'},
networkeffects:{example:'A messaging app with one user is not very useful for messaging friends. As more of your friends join, it may become more useful to you. More users can also attract spam, so growth does not automatically improve every experience.',next:'principal',door:'What changes when a platform designs the incentives?'},
cyberrisk:{example:'Imagine a message apparently from a colleague asks you to log in through a link immediately. Calling them using a number you already know is one way to check whether the request is real before acting.',next:'queues',door:'What other weak points can appear when a system gets busy?'},
adverse:{example:'Suppose an insurer offers one fixed premium while customers know more about their personal risk than the insurer. Higher-risk customers may be more eager to buy; the insurer may then face higher average claims than expected. Actual insurance markets involve many other details.',next:'principal',door:'What happens when two parties have different information and incentives?'},
opportunity:{example:'Suppose you have one free hour and your best alternative to working on an app is taking a walk you value. If you choose the app, the opportunity cost is that walk—not every other activity you could imagine.',next:'optionality',door:'When might keeping your options open be valuable?'},
queues:{example:'Imagine a coffee counter that can serve roughly 20 customers an hour. If an average of 19 arrive per hour, even short bursts or slower orders can create a queue. Real waiting times depend on arrival patterns and service-time variation.',next:'feedback',door:'Can the queue itself change how people behave?'},
principal:{example:'A sales adviser paid only on commission might prefer a more expensive product, while the customer wants the best fit. Disclosure and suitable incentives can help, although they do not automatically eliminate conflicts.',next:'adverse',door:'What if the two sides also know different things?'},
optionality:{example:'A startup might test an idea with a small prototype before committing a full budget. The test preserves the option to change direction, though it also costs time and money.',next:'opportunity',door:'What are you giving up while keeping that option open?'},
feedback:{example:'A delivery service gets busy, so deliveries arrive late. Customers call for updates, taking staff time away from processing orders and causing further delays. A callback system might interrupt that loop; other feedback can stabilise a system instead.',next:'queues',door:'Why do waiting times grow so quickly near full capacity?'},
nash:{example:'Two competing cafés each choose whether to advertise heavily. The payoff for either café depends partly on the other’s choice. A Nash equilibrium is a pair of choices where neither café benefits by changing alone, given the other’s choice; the actual equilibrium depends on the payoffs.',next:'principal',door:'How do incentives shape decisions between people?'},
bankrun:{example:'Imagine depositors hear a rumour and many try to withdraw at once. A bank may struggle to turn longer-term assets into cash quickly, so the rush itself can intensify a liquidity problem. This is a simplified scenario, not a diagnosis of any particular bank.',next:'adverse',door:'How can unequal information change a financial market?'}

let pendingPack=null;
const beforePackGarden=garden;
garden=function(){return beforePackGarden()+`<div class="section card"><div class="kicker">Content</div><h3>Add a reviewed content pack</h3><p class="quiet">Preview new ideas and their sources before adding them. Only add a pack after checking the content and links.</p><button class="btn" onclick="document.getElementById('contentPackInput').click()">Preview a content pack</button><input id="contentPackInput" type="file" accept="application/json,.json" style="display:none" onchange="previewPack(this)"></div>`};
async function previewPack(input){const file=input.files&&input.files[0];input.value='';if(!file)return;try{if(file.size>500000)throw Error('This pack is too large.');const pack=JSON.parse(await file.text());if(!validatePack(pack))throw Error('This pack has missing fields, unsafe text, or an ID already in use.');pendingPack=pack;const all=[...pack.ideas.map(x=>({title:x.title,body:x.body,sources:x.sources})),...pack.paths.flatMap(x=>x.items.map(t=>({title:t.title,body:t.idea,sources:t.sources})))];document.getElementById('modalbox').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">Review before adding</div><h2>${esc(pack.title)}</h2><p class="quiet">${pack.ideas.length} ideas · ${pack.paths.length} rabbit holes. Check the explanations and sources before adding.</p>${all.map(x=>`<div class="bridgebox"><b>${esc(x.title)}</b><p class="quiet">${esc(x.body)}</p>${x.sources.map(u=>`<a class="softbutton" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Source ↗</a>`).join(' · ')}</div>`).join('')}<button class="btn primary" onclick="approvePack()">Add this pack</button> <button class="btn" onclick="closeModal()">Cancel</button>`;document.getElementById('modal').classList.add('open')}catch(e){alert(e.message||'Unable to read this pack.')}}
function approvePack(){if(!pendingPack||!validatePack(pendingPack)){alert('This pack is no longer valid.');return}state.reviewedPacks=Array.isArray(state.reviewedPacks)?state.reviewedPacks:[];state.reviewedPacks.push(pendingPack);save();applyReviewedPack(pendingPack);pendingPack=null;closeModal();page('discover');toast('Reviewed ideas added.')}
const restorePrevious=importGarden;
importGarden=async function(input){const before=state;await restorePrevious(input);if(state!==before)location.reload()};
const newsLenses=[{terms:/\b(bank|banks|banking|depositor|depositors|bankrupt)\b/i,idea:'bankrun',path:'original',label:'Trust and bank runs'},{terms:/\b(stock|stocks|market|markets|investor|investors|shares|bonds)\b/i,idea:'kelly',path:'risk',label:'Risk and decision-making'},{terms:/\b(cyber|ransomware|hack|hacker|hackers|phishing|breach)\b/i,idea:'cyberrisk',path:'security',label:'Trust and cyber risk'},{terms:/\b(platform|marketplace|app|apps|social media)\b/i,idea:'networkeffects',path:'platform',label:'Platforms and network effects'}];
function lensForHeadline(title){return newsLenses.find(x=>x.terms.test(title))||null}
async function showLiveNews(section){const box=document.getElementById('modalbox'),modal=document.getElementById('modal');const tech=section==='technology',fallback=tech?'https://www.reuters.com/technology/':'https://www.reuters.com/business/finance/';box.innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">Latest reporting</div><h2>${tech?'Technology':'Business'}</h2><p class="quiet">Tap a headline to read the original story. Suggested ideas are starting points, not summaries or claims about the article.</p><div class="quiet" id="newsResult">Looking for recent stories…</div><a class="btn" href="${fallback}" target="_blank" rel="noopener noreferrer">Open Reuters ↗</a>`;modal.classList.add('open');let el=document.getElementById('newsResult');try{let rss=tech?'https://feeds.bbci.co.uk/news/technology/rss.xml':'https://feeds.bbci.co.uk/news/business/rss.xml',controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000),response;try{response=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss),{signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw Error();let data=await response.json();if(data.status!=='ok'||!Array.isArray(data.items))throw Error();let items=data.items.filter(x=>{try{let u=new URL(x.link);return typeof x.title==='string'&&u.protocol==='https:'&&(u.hostname==='bbc.com'||u.hostname.endsWith('.bbc.com')||u.hostname==='bbc.co.uk'||u.hostname.endsWith('.bbc.co.uk'))}catch{return false}}).slice(0,4);if(!items.length)throw Error();el.innerHTML='<span class="kicker">BBC News · checked '+esc(new Date().toLocaleString())+'</span>'+items.map(x=>{let lens=lensForHeadline(x.title);return `<div class="bridgebox"><a class="softbutton" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.title)} ↗</a><p class="quiet">${esc(x.pubDate||'Date not supplied')}</p>${lens?`<p class="quiet">Curious about a related idea? ${lens.label}</p><div class="actions"><button class="btn" onclick="openCard('${lens.idea}')">Explore the idea →</button><button class="btn" onclick="startTrail(groupFor('${collections.find(p=>p.id===lens.path).items[0].id}').items[0].id)">Follow a related path →</button></div>`:''}</div>`}).join('')}catch(e){el.textContent='The live feed is unavailable right now. Use the link below for current reporting.'}}

render("home");
</script>
</body>
</html>
